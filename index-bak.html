<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoCC Live Location</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
                <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" /> 

        
        <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- HEADER -->
    <header class="text-bg-light">
        <div class="container">
            <div class="d-flex justify-content-between">
                <div class="d-flex align-items-center">
                    <img src="logo-without-title-crop.png" alt="" class="mt-1" width="36">
                    <img src="logo-letter-only-crop.png" alt="" class="mt-2 mx-1" width="150">
                </div>

                <div class="d-flex align-items-center">
                    <button id="toggleSidebarBtn" class="btn btn-lg mt-1">
                        <img src="layout-sidebar.svg" alt="layout-sidebar" class="mb-1" width="24">
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="row g-0">
        <!-- SIDEBAR -->
        <div id="sidebarCol" class="col-3 bg-body-tertiary">
            <div class="list-group list-group-flush">
        
                <a href="#" class="list-group-item list-group-item-action active py-3 lh-sm">
                    <strong id="name_1">N/A</strong>
                    <div class="small mt-2">placeholder text...</div>
                </a>
        
                <a href="#" class="list-group-item list-group-item-action py-3 lh-sm">
                    <strong id="name_2">N/A</strong>
                    <div class="small mt-2">placeholder text...</div>
                </a>
        
            </div>
        </div>
        
        <!-- MAP COLUMN -->
        <div id="mapCol" class="col-9">
            <div id="map"></div>
        </div>
    </div>





    <!-- Script js -->
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="script.js"></script>

    <script>
        const btn = document.getElementById('toggleSidebarBtn');
        const sidebarCol = document.getElementById('sidebarCol');
        const mapCol = document.getElementById('mapCol');

        btn.addEventListener('click', () => {
            const isHidden = sidebarCol.classList.toggle('d-none'); // hide/show sidebar

            if (isHidden) {
                // Sidebar hidden → map full width
                mapCol.classList.remove('col-9');
                mapCol.classList.add('col-12');
            } else {
                // Sidebar shown → map 9 columns
                mapCol.classList.remove('col-12');
                mapCol.classList.add('col-9');
            }

            // If you're using Leaflet and your map instance is called "map",
            // uncomment this so the map resizes correctly:
            // setTimeout(() => {
            //     map.invalidateSize();
            // }, 200);
        });

            // toggle sidebar + expand map
                document.getElementById("toggleSidebarBtn").addEventListener("click", function () {
                    document.body.classList.toggle("sidebar-hidden");

                    // fix leaflet map resize
                    setTimeout(() => map.invalidateSize(), 1);
                });
    </script>

</body>

</html>
